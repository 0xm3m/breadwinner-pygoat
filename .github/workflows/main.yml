name: CI

on:
  push:
    branches: [ master ]

jobs:
  bandit_scan:
    name: Run Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Scan
        run: |
          bandit -ll -ii -r . -f json -o bandit_report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit_report.json

  semgrep_scan:
    name: Run Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config auto --json --output semgrep_report.json

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep_report.json

  snyk_scan:
    name: Run Snyk SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Snyk Code Scan
        uses: snyk/actions/python-3.12@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --json-file-output=snyk_report.json

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: snyk-report
          path: snyk_report.json

  image_scan:
    name: Build Image and Run Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1 

      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@v1
        with:
          docker-version: '20.10.24'

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile -t myapp:latest .
        
      #- name: Docker Scout Scan
      #  run: |
      #    curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
      #    
      #    echo ${{ secrets.REPO_PWD }} | docker login -u ${{ secrets.REPO_USER }} --password-stdin
      #    
      #    docker scout quickview
      #    docker scout cves

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.REPO_USER }}
          dockerhub-password: ${{ secrets.REPO_PWD }}
          command: quickview, cves
