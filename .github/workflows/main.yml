name: CI

on:
  push:
    branches: [ master ]

jobs:
  bandit_scan:
    name: Run Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Scan
        run: |
          bandit -ll -ii -r . -f json -o bandit_report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit_report.json

  semgrep_scan:
    name: Run Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config auto --json --output semgrep_report.json

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep_report.json

  snyk_scan:
    name: Run Snyk SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Snyk Code Scan
        uses: snyk/actions/python-3.12@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --json-file-output=snyk_report.json

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: snyk-report
          path: snyk_report.json

  zap_dast_scan:
    name: Run ZAP DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Start Web Application in Docker
        run: |
          echo ${{ secrets.REPO_PWD }} | docker login -u ${{ secrets.REPO_USER }} --password-stdin
          docker pull pygoat/pygoat:latest
          docker run --rm -p 8000:8000 pygoat/pygoat:latest

      - name: Start and Run ZAP in Docker
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -t  ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://host.docker.internal:8000 -r zap_report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: zap-report
          path: zap_report.html